<title>Leo's Busy Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: a bright toy-box world. Sky ground, chunky white panels with a pressed "toy button" shadow, big tappable picture cards. Single bright theme by choice. */
:root{
  --sky:#DCEFFF; --ink:#22305A; --muted:#566690; --card:#FFFFFF; --soft:#EEF6FF; --edge:#BFD9F2;
  --sun:#FFC83D; --sun-sh:#D99A12; --grass:#3FB36F; --grass-sh:#2B8A52; --coral:#FF6F61; --coral-sh:#CC4E42;
  --grape:#8C7BEF; --grape-sh:#6656C9; --ok:#2FB36A; --bad:#F0544F;
  --f-display:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  margin:0; background:var(--sky); color:var(--ink); font-family:var(--f-body); font-size:18px; font-weight:700;
  background-image:radial-gradient(circle at 8% 0%,#FFFFFF 0,transparent 28%),radial-gradient(circle at 95% 6%,#FFF4CF 0,transparent 22%);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:980px;margin:0 auto;padding-block:10px 36px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit}
button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}

/* top bar */
.top{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;background:none;border:0;cursor:pointer;padding:0;text-align:left}
.brand svg{width:46px;height:46px;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4vw,30px);line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:5px 14px 5px 8px;font-family:var(--f-display);font-weight:800;font-size:22px;box-shadow:0 4px 0 var(--edge);font-variant-numeric:tabular-nums}
.pill svg{width:28px;height:28px}
.pill.bump{animation:bump .5s}
.iconbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--card);box-shadow:0 4px 0 var(--edge);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:26px;height:26px}

/* shared */
.panel{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 7px 0 var(--edge)}
.art{border-radius:20px;overflow:hidden;background:#fff;aspect-ratio:4/3;width:100%;max-width:100%}
.art svg{display:block;width:100%;height:100%}
.eyebrow{display:block;font-size:14px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px;border:0;border-radius:18px;padding:10px 22px;background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-sh);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sun-sh)}
.btn.green{background:var(--grass);color:#fff;box-shadow:0 5px 0 var(--grass-sh)}
.btn.white{background:var(--soft);box-shadow:0 5px 0 var(--edge)}
.btn svg{width:26px;height:26px}
.progress{display:flex;gap:6px;margin-bottom:14px}
.progress i{flex:1;height:12px;border-radius:6px;background:#E3EEF9}
.progress i.on{background:var(--grass)}
.progress i.now{background:var(--sun)}
.prompt{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.speak{width:66px;height:66px;border-radius:50%;border:0;background:var(--grape);color:#fff;box-shadow:0 5px 0 var(--grape-sh);display:grid;place-items:center;cursor:pointer;flex:none}
.speak:active{transform:translateY(4px);box-shadow:0 1px 0 var(--grape-sh)}
.speak svg{width:32px;height:32px}
.prompt > div{min-width:0}
.prompt strong{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,42px);line-height:1.05;display:block;text-wrap:balance}

/* home */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:center}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,7vw,62px);line-height:.95;margin:4px 0 10px;text-wrap:balance}
.hero p{font-size:20px;margin:0 0 16px;color:var(--muted);max-width:30ch}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.mode{border:0;background:var(--card);border-radius:24px;padding:12px 12px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:0 7px 0 var(--c);transition:transform .12s}
.mode:hover{transform:translateY(-3px)}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c)}
.mode .art{border:4px solid var(--c)}
.mode h3{font-family:var(--f-display);font-weight:800;font-size:24px;margin:4px 0 0;line-height:1.05}
.mode p{margin:0;color:var(--muted);font-size:16px;line-height:1.3}

/* learn */
.learn{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:center}
.learn .art{animation:pop .35s ease-out}
.phrase{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,6.4vw,60px);line-height:1.02;margin:4px 0 14px;display:flex;flex-wrap:wrap;gap:0 .26em}
.word{border:0;background:none;padding:0 3px;border-radius:12px;cursor:pointer;line-height:1.05}
.word:hover{background:#FFF1BF}
.word.verb{color:var(--coral)}
.timechip{display:inline-flex;align-items:center;gap:12px;border:0;background:var(--soft);border-radius:20px;padding:8px 18px 8px 8px;cursor:pointer;text-align:left;box-shadow:0 4px 0 var(--edge)}
.timechip svg{width:62px;height:62px;flex:none}
.timechip b{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.timechip span{color:var(--muted);font-size:17px}
.learnbtns{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.navrow{display:flex;align-items:center;gap:12px;margin-top:18px}
.dots{display:flex;gap:7px;flex-wrap:wrap;flex:1;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:#D5E3F3}
.dots i.on{background:var(--coral)}
.arrow{width:58px;height:58px;border-radius:50%;border:0;background:var(--sun);box-shadow:0 5px 0 var(--sun-sh);cursor:pointer;display:grid;place-items:center;flex:none}
.arrow:disabled{opacity:.35;cursor:default}
.arrow svg{width:28px;height:28px}

/* pick cards */
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pick{border:0;padding:0;background:none;cursor:pointer;border-radius:24px;display:flex;flex-direction:column;gap:6px;transition:transform .1s;text-align:center}
.pick .art{border:5px solid #E3EEF9;box-shadow:0 6px 0 #C9DDF1}
.pick:hover .art{border-color:var(--sun)}
.pick.right .art{border-color:var(--ok);box-shadow:0 6px 0 var(--grass-sh)}
.pick.right{animation:bump .5s}
.pick.wrong{animation:shake .45s}
.pick.wrong .art{border-color:var(--bad);opacity:.55}

/* order */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.slot{border:3px dashed #B9CDE6;border-radius:18px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;background:var(--soft);min-width:0}
.slot .lbl{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.2}
.slot .slot-art{width:100%;aspect-ratio:4/3;border-radius:12px;display:grid;place-items:center;color:#AFC3DD;font-family:var(--f-display);font-size:30px;font-weight:800}
.slot.filled{border-style:solid;border-color:var(--grass);background:#E7F8EE}
.slot.filled .slot-art{animation:pop .3s ease-out;overflow:hidden}
.slot .slot-art svg{width:100%;height:100%;display:block}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cap{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.cap b{font-size:17px}
.cap em{font-style:normal;font-family:var(--f-display);font-weight:800;background:var(--soft);border-radius:999px;padding:0 10px;font-size:17px;font-variant-numeric:tabular-nums}
.card.used{visibility:hidden}
.after{display:flex;justify-content:center;margin-top:16px}

/* when */
.when{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:center}
.when strong.big{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.05;display:block;margin:4px 0 14px}
.bins{display:grid;gap:12px}
.bin{display:flex;align-items:center;gap:14px;border:0;border-radius:20px;padding:10px 18px 10px 12px;font-family:var(--f-display);font-weight:800;font-size:28px;cursor:pointer;background:var(--b);box-shadow:0 5px 0 var(--bs);text-align:left}
.bin:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bs)}
.bin svg{width:52px;height:52px;flex:none}
.bin.wrong{animation:shake .45s;opacity:.5}
.bin.right{outline:5px solid var(--ok);outline-offset:2px}
.sentence{min-height:1.4em;margin-top:14px;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--grass-sh)}

/* done */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.done .art{max-width:420px}
.done h2{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,8vw,64px);margin:0;line-height:1}
.done p{margin:0;font-size:20px;color:var(--muted)}
.starrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.starrow svg{width:44px;height:44px}
.starrow .lit{animation:pop .4s ease-out backwards}
.donebtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* feedback */
#cheer{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%) scale(0);background:var(--grass);color:#fff;font-family:var(--f-display);font-weight:800;font-size:34px;padding:6px 28px;border-radius:999px;box-shadow:0 6px 0 var(--grass-sh);pointer-events:none;z-index:50;transition:transform .28s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
#cheer.show{transform:translateX(-50%) scale(1)}
#cheer.bad{background:var(--coral);box-shadow:0 6px 0 var(--coral-sh)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:scale(1);opacity:1}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.08)}}

@media (max-width:860px){.modes{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .hero,.learn,.when{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:520px){
  .choices{gap:8px}
  .pick .art{border-width:4px}
  .slot .lbl{font-size:15px}
  .slots{gap:6px}
  .cap b{font-size:15px}
  .bin{font-size:24px}
  .mode h3{font-size:20px}
  .mode p{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <button class="brand" data-act="home" aria-label="Leo's Busy Day, home">
      <svg viewBox="0 0 48 48" aria-hidden="true"><g stroke="#FF9F1C" stroke-width="3.5" stroke-linecap="round"><path d="M24 3v6M24 39v6M3 24h6M39 24h6M9 9l4 4M35 35l4 4M39 9l-4 4M13 35l-4 4"/></g><circle cx="24" cy="24" r="12" fill="#FFC83D"/><circle cx="20" cy="22" r="1.8" fill="#22305A"/><circle cx="28" cy="22" r="1.8" fill="#22305A"/><path d="M19 27q5 5 10 0" stroke="#22305A" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <b>Leo's Busy Day</b>
    </button>
    <span class="pill" id="pill" aria-label="Stars"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z" fill="#FFC83D" stroke="#E6A019" stroke-width="1.5" stroke-linejoin="round"/></svg><span id="starCount">0</span></span>
    <button class="iconbtn" id="muteBtn" data-act="mute" aria-label="Sound on"></button>
    <button class="iconbtn" id="homeBtn" data-act="home" aria-label="Home" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="#22305A"/></svg></button>
  </header>
  <main id="screen"></main>
</div>
<div id="cheer" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function(){
const $ = s => document.querySelector(s);
const screen = $('#screen');
const SKIN = '#F6C9A4';
const INK = '#22305A';

/* ---------- drawing helpers ---------- */
const W = c => `<rect width="240" height="180" fill="${c}"/>`;
const F = (c, y=140) => `<rect y="${y}" width="240" height="${180-y}" fill="${c}"/>`;
const bub = (x,y,r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#FFFFFF" stroke="#A9DDF5" stroke-width="1.2"/>`;
const drop = (x,y) => `<path d="M${x},${y} q-5,7 0,10 q5,-3 0,-10Z" fill="#38BDF8"/>`;
const cloud = (x,y) => `<g fill="#FFFFFF"><ellipse cx="${x}" cy="${y}" rx="17" ry="8"/><circle cx="${x-6}" cy="${y-5}" r="7"/><circle cx="${x+5}" cy="${y-7}" r="9"/></g>`;
const flower = (x,y,c) => `<g transform="translate(${x} ${y})"><line y2="10" stroke="#2B8A52" stroke-width="2"/><circle cx="-3" cy="-2" r="3" fill="${c}"/><circle cx="3" cy="-2" r="3" fill="${c}"/><circle cx="0" cy="-5" r="3" fill="${c}"/><circle cx="0" cy="1" r="3" fill="${c}"/><circle cx="0" cy="-2" r="2" fill="#FFD43B"/></g>`;
function star(x,y,r,c){let p=[];for(let i=0;i<10;i++){const rr=i%2?r*.45:r;const a=(-90+i*36)*Math.PI/180;p.push((x+Math.cos(a)*rr).toFixed(1)+','+(y+Math.sin(a)*rr).toFixed(1));}return `<polygon points="${p.join(' ')}" fill="${c}"/>`;}
function tiles(c){let s='';for(let x=24;x<240;x+=24)s+=`<line x1="${x}" y1="0" x2="${x}" y2="180" stroke="${c}" stroke-width="1.5"/>`;for(let y=24;y<180;y+=24)s+=`<line x1="0" y1="${y}" x2="240" y2="${y}" stroke="${c}" stroke-width="1.5"/>`;return s;}
const tshirt = (x,y,c,s) => `<path transform="translate(${x} ${y}) scale(${s})" d="M-12,-20 Q0,-13 12,-20 L24,-12 L18,-2 L12,-6 L12,20 L-12,20 L-12,-6 L-18,-2 L-24,-12Z" fill="${c}"/>`;
const hand = (x,y,c=SKIN) => `<circle cx="${x}" cy="${y}" r="6.5" fill="${c}"/>`;

function clockFace(cx,cy,r,h,m){
  let t='';
  for(let k=0;k<12;k++){const a=k*30*Math.PI/180;const big=k%3===0;t+=`<circle cx="${(Math.sin(a)*r*.76).toFixed(1)}" cy="${(-Math.cos(a)*r*.76).toFixed(1)}" r="${(big?r*.08:r*.045).toFixed(2)}" fill="${INK}"/>`;}
  const ha=(h%12+m/60)*30, ma=m*6;
  return `<g transform="translate(${cx} ${cy})"><circle r="${r}" fill="#FFFFFF" stroke="#FF6F61" stroke-width="${r*.13}"/>${t}<line x2="0" y2="${-r*.44}" stroke="${INK}" stroke-width="${r*.12}" stroke-linecap="round" transform="rotate(${ha})"/><line x2="0" y2="${-r*.66}" stroke="${INK}" stroke-width="${r*.075}" stroke-linecap="round" transform="rotate(${ma})"/><circle r="${r*.09}" fill="${INK}"/></g>`;
}

function windowA(x,y,mode){
  const glass={sunrise:'#FFE3A3',day:'#9ED8F7',afternoon:'#FFD59A',evening:'#F7A07A',night:'#22306B'}[mode];
  let c='';
  if(mode==='sunrise') c=`<circle cx="18" cy="38" r="11" fill="#FFB52E"/><ellipse cx="40" cy="14" rx="8" ry="3.5" fill="#FFFFFF"/>`;
  if(mode==='day') c=`<circle cx="15" cy="14" r="7" fill="#FFD43B"/><ellipse cx="38" cy="32" rx="9" ry="4" fill="#FFFFFF"/>`;
  if(mode==='afternoon') c=`<circle cx="36" cy="22" r="8" fill="#FF9F1C"/>`;
  if(mode==='evening') c=`<circle cx="28" cy="42" r="12" fill="#FF6B3D"/><circle cx="10" cy="10" r="1.5" fill="#FFFFFF"/><circle cx="46" cy="8" r="1.2" fill="#FFFFFF"/>`;
  if(mode==='night') c=`<circle cx="36" cy="15" r="8" fill="#FFF1A8"/><circle cx="40" cy="12" r="7" fill="${glass}"/><circle cx="11" cy="11" r="1.5" fill="#FFFFFF"/><circle cx="19" cy="31" r="1.2" fill="#FFFFFF"/><circle cx="45" cy="35" r="1.5" fill="#FFFFFF"/>`;
  return `<g transform="translate(${x} ${y})"><rect x="-3" y="-3" width="62" height="52" rx="6" fill="#FFFFFF"/><svg x="1" y="1" width="54" height="44" viewBox="0 0 54 44"><rect width="54" height="44" fill="${glass}"/>${c}</svg><rect x="25.5" y="1" width="5" height="44" fill="#FFFFFF"/><rect x="1" y="20.5" width="54" height="5" fill="#FFFFFF"/></g>`;
}

/* Leo (and friends): head centre at (0,0), radius 26 */
function kid(x,y,o={}){
  const s=o.s||1, skin=o.skin||SKIN, hair=o.hair||'#7B4A2A', shirt=o.shirt||'#3B82F6', pants=o.pants||'#2F3E66';
  const hands=o.hands||[[-26,58],[26,58]];
  let g=`<g transform="translate(${x} ${y}) scale(${s})${o.rot?` rotate(${o.rot})`:''}">`;
  if(o.legs){const sh=o.shoes||'#E2483D';g+=`<rect x="-20" y="60" width="17" height="40" rx="7" fill="${pants}"/><rect x="3" y="60" width="17" height="40" rx="7" fill="${pants}"/><ellipse cx="-13" cy="101" rx="13" ry="6" fill="${sh}"/><ellipse cx="13" cy="101" rx="13" ry="6" fill="${sh}"/>`;}
  if(o.pack) g+=`<rect x="-32" y="26" width="64" height="40" rx="12" fill="${o.pack}"/>`;
  g+=`<path d="M-23,68 L-23,40 Q-23,22 0,22 Q23,22 23,40 L23,68 Q0,74 -23,68Z" fill="${shirt}"/>`;
  if(o.pack) g+=`<path d="M-14,25 L-13,62 M14,25 L13,62" stroke="#C98A12" stroke-width="5" stroke-linecap="round"/>`;
  if(o.pigtails) g+=`<circle cx="-31" cy="-6" r="10" fill="${hair}"/><circle cx="31" cy="-6" r="10" fill="${hair}"/><circle cx="-24" cy="-10" r="3" fill="#FFC83D"/><circle cx="24" cy="-10" r="3" fill="#FFC83D"/>`;
  g+=`<circle cx="-25" cy="2" r="6" fill="${skin}"/><circle cx="25" cy="2" r="6" fill="${skin}"/><circle r="26" fill="${skin}"/>`;
  g+=`<path d="M-26,-2 C-30,-34 30,-36 26,-2 C22,-14 12,-19 2,-17 C-8,-22 -20,-14 -26,-2Z" fill="${hair}"/>`;
  if(o.eyes==='closed') g+=`<path d="M-13,-1 q4,4 8,0 M5,-1 q4,4 8,0" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  else g+=`<circle cx="-9" cy="-1" r="3.7" fill="${INK}"/><circle cx="9" cy="-1" r="3.7" fill="${INK}"/><circle cx="-8" cy="-2.4" r="1.3" fill="#FFFFFF"/><circle cx="10" cy="-2.4" r="1.3" fill="#FFFFFF"/>`;
  g+=`<circle cx="-15" cy="8" r="4.2" fill="#FF8FA3" opacity=".5"/><circle cx="15" cy="8" r="4.2" fill="#FF8FA3" opacity=".5"/>`;
  const m=o.mouth||'smile';
  if(m==='smile') g+=`<path d="M-8,9 Q0,17 8,9" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  if(m==='yawn') g+=`<ellipse cx="0" cy="12" rx="5" ry="7" fill="#B83A52"/>`;
  if(m==='cheer') g+=`<path d="M-9,8 Q0,22 9,8Z" fill="#B83A52"/>`;
  if(m==='eat') g+=`<ellipse cx="0" cy="12" rx="4.5" ry="3.8" fill="#B83A52"/>`;
  if(m==='teeth') g+=`<rect x="-7" y="8" width="14" height="7" rx="3" fill="#FFFFFF" stroke="#B83A52" stroke-width="1.6"/>`;
  if(!o.noArms) hands.forEach(([hx,hy],i)=>{const sx=i?17:-17;g+=`<path d="M${sx},34 L${hx},${hy}" stroke="${shirt}" stroke-width="11" stroke-linecap="round"/><circle cx="${hx}" cy="${hy}" r="6.5" fill="${skin}"/>`;});
  return g+'</g>';
}

/* ---------- the scenes ---------- */

const SPK = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;

const SOUND = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="${INK}"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="${INK}" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const STAR = (lit) => `<svg viewBox="0 0 24 24" class="${lit?'lit':''}" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z" fill="${lit?'#FFC83D':'#E3EEF9'}" stroke="${lit?'#E6A019':'#C9DDF1'}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
const ARROW = d => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d==='l'?'M15 5l-7 7 7 7':'M9 5l7 7-7 7'}" stroke="${INK}" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function partIcon(p){
  if(p==='morning') return `<svg viewBox="0 0 48 48" aria-hidden="true"><g stroke="#E6A019" stroke-width="3" stroke-linecap="round"><path d="M24 8v5M10 16l3.5 3.5M38 16l-3.5 3.5M4 30h5M39 30h5"/></g><path d="M12 34a12 12 0 0 1 24 0Z" fill="#FFC83D"/><path d="M5 36h38" stroke="#3FB36F" stroke-width="4" stroke-linecap="round"/></svg>`;
  if(p==='afternoon') return `<svg viewBox="0 0 48 48" aria-hidden="true"><g stroke="#FF9F1C" stroke-width="3" stroke-linecap="round"><path d="M24 3v5M24 40v5M3 24h5M40 24h5M9 9l3.5 3.5M35.5 35.5L39 39M39 9l-3.5 3.5M12.5 35.5L9 39"/></g><circle cx="24" cy="24" r="11" fill="#FF9F1C"/></svg>`;
  return `<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="22" cy="25" r="15" fill="#FFE27A"/><circle cx="29" cy="20" r="13" fill="var(--b)"/>${star(38,10,5,'#FFFFFF')}${star(10,8,3.5,'#FFFFFF')}</svg>`;
}

/* ---------- sound & speech ---------- */
let muted=false, voice=null, AC=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/samantha|aria|jenny|zira|google us|female/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}}
try{ if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;} }catch(e){}
function say(t, delay=0){
  if(muted) return;
  const go=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;u.pitch=1.15;if(voice)u.voice=voice;speechSynthesis.speak(u);}catch(e){}};
  delay?setTimeout(go,delay):go();
}
function hush(){try{speechSynthesis.cancel();}catch(e){}}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function beep(seq){
  const c=ac(); if(!c||muted) return; try{c.resume&&c.resume();}catch(e){}
  let t=c.currentTime+.01;
  seq.forEach(([f,d,type,v])=>{const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.14,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d);t+=d*.65;});
}
const ding = () => beep([[660,.14],[880,.14],[1320,.32]]);
const plink = () => beep([[990,.12],[1320,.18]]);
const buzz = () => beep([[230,.2,'triangle',.18],[170,.28,'triangle',.18]]);
function setMuteIcon(){const b=$('#muteBtn');b.innerHTML=muted?MUTED:SOUND;b.setAttribute('aria-label',muted?'Sound off':'Sound on');}

/* ---------- stars, cheers, confetti ---------- */
let stars=0; try{stars=parseInt(localStorage.getItem('leo-stars')||'0',10)||0;}catch(e){}
function addStars(n){stars+=n;try{localStorage.setItem('leo-stars',String(stars));}catch(e){}$('#starCount').textContent=stars;const p=$('#pill');p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump');}
const YAY=['Great job!','Super!','Well done!','Awesome!','You got it!','Fantastic!'];
const rnd = a => a[Math.floor(Math.random()*a.length)];
let cheerT;
function cheer(text,bad){const c=$('#cheer');c.textContent=text;c.classList.toggle('bad',!!bad);c.classList.add('show');clearTimeout(cheerT);cheerT=setTimeout(()=>c.classList.remove('show'),1000);}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(){
  if(reduce) return;
  const cv=$('#fx'), x=cv.getContext('2d'), d=window.devicePixelRatio||1, w=innerWidth, h=innerHeight;
  cv.width=w*d; cv.height=h*d; x.setTransform(d,0,0,d,0,0);
  const cols=['#FFC83D','#FF6F61','#3FB36F','#8C7BEF','#5FA8F5','#F472B6'];
  const ps=Array.from({length:150},()=>({x:Math.random()*w,y:-20-Math.random()*h*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:6+Math.random()*7,c:rnd(cols),r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,w,h);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(t-t0<3200)requestAnimationFrame(f);else x.clearRect(0,0,w,h);})(t0);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const progress = (n,cur) => `<div class="progress" aria-label="Question ${cur+1} of ${n}">${Array.from({length:n},(_,k)=>`<i class="${k<cur?'on':k===cur?'now':''}"></i>`).join('')}</div>`;

/* ---------- screens ---------- */
let G={};
let timers=[];
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
function go(view){
  timers.forEach(clearTimeout); timers=[]; hush();
  $('#homeBtn').hidden = view==='home';
  VIEWS[view]();
  try{window.scrollTo(0,0);}catch(e){}
}

function home(){
  G={type:'home'};
  screen.innerHTML=`
  <div style="display:flex;flex-direction:column;gap:18px">
  <section class="hero panel">
    <div class="art">${heroSvg()}</div>
    <div>
      <span class="eyebrow">My daily routine</span>
      <h1>Hi! I'm Leo.</h1>
      <p>Come and see my busy day. Then play the games and win stars!</p>
      <button class="btn" data-act="hello">${SPK} Say hello</button>
    </div>
  </section>
  <section class="modes">
    ${MODES.map(m=>`<button class="mode" style="--c:${m.c}" data-act="mode" data-mode="${m.id}"><div class="art">${art(m.pic)}</div><h3>${m.title}</h3><p>${m.sub}</p></button>`).join('')}
  </section></div>`;
}

function learn(i=0){
  G={type:'learn', i};
  const a=ACTS[i], words=a.text.split(' ');
  screen.innerHTML=`
  <section class="panel learn">
    <div class="art" id="learnArt">${art(a.id)}</div>
    <div>
      <span class="eyebrow">Leo says · ${i+1} of ${ACTS.length}</span>
      <h2 class="phrase">${words.map((w,k)=>`<button class="word${k===1?' verb':''}" data-act="word" data-w="${w.replace('.','')}">${w}</button>`).join('')}</h2>
      <button class="timechip" data-act="sayTime" aria-label="Hear the time">${clockSvg(a)}<span><b>${timeStr(a)}</b>${PARTS[a.part].phrase}</span></button>
      <div class="learnbtns"><button class="btn" data-act="sayPhrase">${SPK} Listen</button></div>
      <div class="navrow">
        <button class="arrow" data-act="prev" aria-label="Back" ${i===0?'disabled':''}>${ARROW('l')}</button>
        <div class="dots">${ACTS.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>
        <button class="arrow" data-act="next" aria-label="Next">${ARROW('r')}</button>
      </div>
    </div>
  </section>`;
  say(a.text, 150);
}

function find(){ G={type:'find', rounds:shuffle(ACTS).slice(0,8), r:0, got:0}; findRound(); }
function findRound(){
  const t=G.rounds[G.r];
  G.choices=shuffle([t,...shuffle(ACTS.filter(x=>x!==t)).slice(0,2)]); G.tries=0; G.lock=false;
  G.promptSay=t.text;
  screen.innerHTML=`
  <section class="panel">
    ${progress(G.rounds.length,G.r)}
    <div class="prompt"><button class="speak" data-act="sayPrompt" aria-label="Listen again">${SPK}</button><div><span class="eyebrow">Listen and find</span><strong>${t.text}</strong></div></div>
    <div class="choices">${G.choices.map((c,k)=>`<button class="pick" data-act="pick" data-k="${k}" aria-label="${c.text}"><div class="art">${art(c.id)}</div></button>`).join('')}</div>
  </section>`;
  say(t.text, 250);
}

const ORDER_LBL=['First','Then','Next','Last'];
const ORDER_ASK=['What does Leo do first?','What does he do then?','What comes next?','What does he do last?'];
function order(){ G={type:'order', r:0, rounds:4, got:0}; orderRound(); }
function orderRound(){
  const idx=shuffle([...ACTS.keys()]).slice(0,4).sort((a,b)=>a-b);
  G.seq=idx.map(i=>ACTS[i]); G.cards=shuffle(G.seq); G.next=0;
  G.promptSay="Put Leo's day in order. "+ORDER_ASK[0];
  screen.innerHTML=`
  <section class="panel">
    ${progress(G.rounds,G.r)}
    <div class="prompt"><button class="speak" data-act="sayPrompt" aria-label="Listen again">${SPK}</button><div><span class="eyebrow">Put in order · look at the clocks</span><strong id="orderAsk">${ORDER_ASK[0]}</strong></div></div>
    <div class="slots">${ORDER_LBL.map((l,k)=>`<div class="slot" id="slot${k}"><span class="lbl">${l}</span><div class="slot-art">${k+1}</div></div>`).join('')}</div>
    <div class="cards">${G.cards.map((a,k)=>`<button class="pick card" data-act="ocard" data-k="${k}"><div class="art">${art(a.id)}</div><span class="cap"><b>${a.text}</b><em>${timeStr(a)}</em></span></button>`).join('')}</div>
    <div class="after" id="after" hidden><button class="btn green" data-act="onext">${G.r<G.rounds-1?'Next round':'Finish'} ${ARROW('r').replace(INK,'#FFFFFF')}</button></div>
  </section>`;
  say(G.promptSay, 250);
}

function when(){ G={type:'when', rounds:shuffle(ACTS).slice(0,8), r:0, got:0}; whenRound(); }
function whenRound(){
  const t=G.rounds[G.r]; G.tries=0; G.lock=false;
  G.promptSay=t.text+' When do I do it?';
  screen.innerHTML=`
  <section class="panel">
    ${progress(G.rounds.length,G.r)}
    <div class="when">
      <div class="art">${art(t.id)}</div>
      <div>
        <div class="prompt" style="margin-bottom:6px"><button class="speak" data-act="sayPrompt" aria-label="Listen again">${SPK}</button><div><span class="eyebrow">When do I do it?</span><strong>${t.text}</strong></div></div>
        <div class="bins">${Object.entries(PARTS).map(([k,p])=>`<button class="bin" style="--b:${p.b};--bs:${p.bs}" data-act="bin" data-p="${k}">${partIcon(k)}${p.label}</button>`).join('')}</div>
        <div class="sentence" id="sentence" aria-live="polite"></div>
      </div>
    </div>
  </section>`;
  say(G.promptSay, 250);
}

function done(type, got, total, msg){
  G={type:'done', from:type};
  screen.innerHTML=`
  <section class="panel done">
    <div class="art">${art('play')}</div>
    <h2>${got===total?'Perfect!':'Great job!'}</h2>
    <p>${msg||`You got ${got} ${got===1?'star':'stars'}!`}</p>
    <div class="starrow">${Array.from({length:total},(_,k)=>STAR(k<got).replace('class="lit"',`class="lit" style="animation-delay:${k*90}ms"`)).join('')}</div>
    <div class="donebtns">
      <button class="btn green" data-act="mode" data-mode="${type}">Play again</button>
      <button class="btn white" data-act="home">More games</button>
    </div>
  </section>`;
  confetti(); ding();
  say((got===total?'Perfect! ':'Great job! ')+(msg||`You got ${got} ${got===1?'star':'stars'}!`), 300);
}

const VIEWS={home, learn:()=>learn(0), find, order, when};

/* ---------- actions ---------- */
const H={
  home:()=>go('home'),
  mode:b=>go(b.dataset.mode),
  hello:()=>say("Hi! I'm Leo. Come and see my busy day!"),
  mute:()=>{muted=!muted;if(muted)hush();setMuteIcon();},
  word:b=>say(b.dataset.w),
  sayPhrase:()=>say(ACTS[G.i].text),
  sayTime:()=>{const a=ACTS[G.i];say(`At ${a.said}, ${PARTS[a.part].phrase}.`);},
  prev:()=>{if(G.i>0){hush();learn(G.i-1);}},
  next:()=>{hush();if(G.i<ACTS.length-1)learn(G.i+1);else{addStars(3);done('learn',3,3,"You learned Leo's whole day!");}},
  sayPrompt:()=>say(G.promptSay),
  pick:b=>{
    if(G.lock) return;
    const c=G.choices[+b.dataset.k], t=G.rounds[G.r];
    if(c===t){
      G.lock=true; b.classList.add('right'); ding();
      if(G.tries===0){G.got++;addStars(1);}
      const y=rnd(YAY); cheer(y); say(y+' '+t.text);
      later(()=>{G.r++; G.r<G.rounds.length?findRound():done('find',G.got,G.rounds.length);},1900);
    } else {
      G.tries++; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); buzz(); cheer('Try again!',true); say('Try again! '+t.text);
    }
  },
  ocard:b=>{
    if(G.next>=4) return;
    const a=G.cards[+b.dataset.k];
    if(a===G.seq[G.next]){
      const s=$('#slot'+G.next); s.classList.add('filled'); s.querySelector('.slot-art').innerHTML=art(a.id);
      b.classList.add('used'); G.next++;
      if(G.next<4){ plink(); $('#orderAsk').textContent=ORDER_ASK[G.next]; say(`${ORDER_LBL[G.next-1]}, ${a.text}`); }
      else {
        ding(); G.got++; addStars(1); cheer(rnd(YAY)); confetti();
        $('#orderAsk').textContent='You did it! Listen to Leo.';
        G.promptSay=G.seq.map((x,k)=>`${ORDER_LBL[k]}, ${x.text}`).join(' ');
        say(G.promptSay, 200);
        $('#after').hidden=false;
      }
    } else {
      b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); buzz(); cheer('Try again!',true); say('Oops! Look at the clock.');
      later(()=>b.classList.remove('wrong'),600);
    }
  },
  onext:()=>{hush();G.r++;G.r<G.rounds?orderRound():done('order',G.got,G.rounds);},
  bin:b=>{
    if(G.lock) return;
    const t=G.rounds[G.r];
    if(b.dataset.p===t.part){
      G.lock=true; b.classList.add('right'); ding();
      if(G.tries===0){G.got++;addStars(1);}
      const sent=`${t.text.slice(0,-1)} ${PARTS[t.part].phrase}.`;
      $('#sentence').textContent=sent; cheer(rnd(YAY)); say(sent);
      later(()=>{G.r++; G.r<G.rounds.length?whenRound():done('when',G.got,G.rounds.length);},2400);
    } else {
      G.tries++; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); buzz(); cheer('Try again!',true); say('Try again!');
    }
  },
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;ac();const f=H[b.dataset.act];if(f)f(b);});
document.addEventListener('keydown',e=>{if(G.type!=='learn')return;if(e.key==='ArrowRight')H.next();if(e.key==='ArrowLeft')H.prev();});

$('#starCount').textContent=stars;
setMuteIcon();
const start=()=>go('home');
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
})();
</script>
